<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SOILLEX</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background: url('bg.jpeg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero {
            text-align: center;
            backdrop-filter: blur(2px);
        }

        .hero img {
            max-width: 600px;   /* ⬅️ increased */
            width: 90%;         /* ⬅️ increased */
            height: auto;
            margin-bottom: 22px;
        }

        .slogan {
            font-size: 18px;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.85);
            text-transform: uppercase;
        }

        @media (max-width: 600px) {
            .hero img {
                max-width: 420px;
            }

            .slogan {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <div class="hero">
        <img src="image.png" alt="SOILLEX Logo">
        <div class="slogan">
            Smart Agriculture. Secured Futures.
        </div>
    </div>
</body>
</html>
