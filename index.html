<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOILLEX</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        min-height: 100vh;
        background:
          linear-gradient(180deg, rgba(0, 0, 0, 0.22), rgba(0, 0, 0, 0.52)),
          url("assets/bg.png") center / cover no-repeat;
        color: #ffffff;
      }

      .page {
        position: relative;
        display: grid;
        grid-template-rows: 1fr auto;
        width: 100%;
        height: 100vh;
        padding: clamp(22px, 4vw, 48px);
      }

      .brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(14px, 2.4vh, 24px);
        min-height: 0;
        padding-bottom: clamp(30px, 8vh, 86px);
        text-align: center;
      }

      .logo {
        width: min(68vw, 700px);
        max-height: 22vh;
        object-fit: contain;
        filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.45));
      }

      .tagline {
        max-width: min(88vw, 860px);
        margin: 0;
        color: rgba(255, 255, 255, 0.94);
        font-size: clamp(18px, 2.45vw, 34px);
        font-weight: 600;
        line-height: 1.22;
        text-shadow: 0 3px 18px rgba(0, 0, 0, 0.58);
      }

      .footer {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 34px;
        color: rgba(255, 255, 255, 0.82);
        font-size: clamp(12px, 1.35vw, 15px);
        font-weight: 500;
        letter-spacing: 0;
        text-align: center;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.58);
      }

      @media (max-width: 640px) {
        .page {
          padding: 22px 18px;
        }

        .brand {
          padding-bottom: 42px;
        }

        .logo {
          width: min(86vw, 480px);
          max-height: 18vh;
        }
      }
    </style>
  </head>
  <body>
    <main class="page" aria-label="SOILLEX landing page">
      <section class="brand" aria-label="SOILLEX">
        <img class="logo" src="assets/logo.png" alt="SOILLEX" />
        <p class="tagline">Intelligent Dome Agriculture</p>
      </section>

      <footer class="footer">© 2026 SOILLEX. All rights reserved.</footer>
    </main>
  </body>
</html>
